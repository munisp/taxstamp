[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taxstamp"
version = "1.0.0"
description = "Nigerian excise tax stamp issuance, payment, and verification platform"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "C4", "T20", "RET", "SIM", "TRY", "PL"]
ignore = ["S101", "TRY003", "PLR0913", "PLR2004", "TRY300", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "PLR0915"]
"scripts/*" = ["T201", "S603", "S607"]
# Alembic revision history is formatter-checked and linted. These generated DDL
# blocks intentionally retain long SQL constraints and a single ordered upgrade.
"migrations/*" = ["E501", "PLR0915"]
"src/taxstamp/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["taxstamp"]

[[tool.mypy.overrides]]
module = ["segno.*"]
ignore_missing_imports = true

# Pydantic synthesises model __init__ signatures using Any; the ban on explicit Any
# stays in force for every hand-written module.
[[tool.mypy.overrides]]
module = ["taxstamp.config", "taxstamp.api.schemas"]
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 900
markers = [
  "unit: pure logic, no external dependency",
  "integration: requires real PostgreSQL and Redis",
  "e2e: exercises the public HTTP interface end to end",
  "concurrency: parallel execution invariants",
  "fault: fault injection / crash recovery",
  "perf: performance budget checks",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["src/taxstamp"]
branch = true
