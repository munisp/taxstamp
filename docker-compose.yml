# Local, disposable stack. Secrets here are throwaway development values and must never
# be reused anywhere else.
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: taxstamp
      POSTGRES_USER: taxstamp
      POSTGRES_PASSWORD: taxstamp
    command: ["postgres", "-c", "log_min_duration_statement=250"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxstamp -d taxstamp"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["56379:6379"]

  migrate:
    build: {context: ., target: runtime}
    entrypoint: ["alembic", "upgrade", "head"]
    environment: &app_env
      TAXSTAMP_ENV: development
      TAXSTAMP_DATABASE_URL: postgresql+psycopg://taxstamp:taxstamp@postgres:5432/taxstamp
      TAXSTAMP_REDIS_URL: redis://redis:6379/0
      TAXSTAMP_API_TOKEN_SECRET: development-api-token-secret-value-not-for-any-real-use
      TAXSTAMP_DEVICE_HMAC_SECRET: development-device-hmac-secret-value-not-for-any-real-use
      TAXSTAMP_PAYMENT_WEBHOOK_SECRET: development-payment-webhook-secret-value-not-for-real-use
      TAXSTAMP_AUDIT_CHAIN_SECRET: development-audit-chain-secret-value-not-for-any-real-use
      TAXSTAMP_EXPORT_SIGNING_SECRET: development-export-signing-secret-value-not-for-real-use
      TAXSTAMP_TRANSPARENCY_SIGNING_SECRET: development-transparency-signing-value-not-for-real
      TAXSTAMP_OFFLINE_SIGNING_SECRET: development-offline-signing-secret-value-not-for-real-use
      TAXSTAMP_OFFLINE_FILTER_SECRET: development-offline-filter-secret-value-not-for-real-use
      TAXSTAMP_CONSUMER_FINGERPRINT_SECRET: development-consumer-fingerprint-value-not-for-real
      TAXSTAMP_REQUIRE_TLS: "false"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: {context: ., target: runtime}
    environment: *app_env
    ports: ["8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}

  worker:
    build: {context: ., target: runtime}
    entrypoint: ["python", "-m", "taxstamp.worker.main"]
    environment: *app_env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  # Everything below is behind the "edge" profile: `docker compose --profile edge up`.
  # The core stack must keep working without it, because these components secure and
  # federate access - they are not in the request's correctness path.

  # APISIX terminates TLS in production, caps body sizes and enforces per-route quotas.
  # In development it serves plain HTTP on 9081 and forwards to the API.
  apisix:
    profiles: ["edge"]
    image: apache/apisix:3.11.0-debian
    volumes:
      - ./deploy/edge/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./deploy/edge/apisix-config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports: ["9081:9080"]
    depends_on:
      api: {condition: service_started}
      redis: {condition: service_healthy}

  # Keycloak issues sessions for humans. Devices never use it, so the core stack does not
  # depend on it being up.
  keycloak:
    profiles: ["edge"]
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: development-only-not-a-real-password
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/identity/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    ports: ["8081:8081"]

  # Permify answers delegation questions. Left in "disabled" authz mode by default: a
  # policy engine must be proven in shadow mode before anything is enforced through it.
  permify:
    profiles: ["edge"]
    image: ghcr.io/permify/permify:v1.2.6
    command: ["serve", "--database-engine=memory"]
    ports: ["3476:3476"]

volumes:
  pgdata:
