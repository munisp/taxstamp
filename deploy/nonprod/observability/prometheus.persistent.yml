global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: keycloak
    static_configs: [{targets: ["keycloak:9000"]}]
  - job_name: apisix
    scheme: https
    metrics_path: /apisix/prometheus/metrics
    static_configs: [{targets: ["apisix:9080"]}]
  # Add Taxstamp only with a dedicated audited service identity and TLS validation.
